services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: downloads the model into the ollama_models volume, then exits.
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Optional trace viewer (open source; traces stay on this machine). Start it with:
  #   docker compose --profile tracing up -d
  # then set OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006 in .env and open http://localhost:6006
  # Phoenix has no login of its own, so its port is published to this machine only.
  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # mailbox settings; see .env.example
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DATA_DIR: /data   # databases live in the app_data volume and survive rebuilds
    volumes:
      - app_data:/data
      - ./logs:/app/logs
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_models:
  app_data:
  phoenix_data:
